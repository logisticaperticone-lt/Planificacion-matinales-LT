<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análisis Censo Thomas</title>
<style>
:root{
  color-scheme: dark;
  --bg:#121212; --card:#1c1c1e; --ink:#f2f2f2; --ink2:#bdbdbd; --ink3:#8a8a8a; --line:#303033; --soft:#252528;
  --brand:#0b0b0b; --brand2:#f07a1e; --accent:#f07a1e; --onacc:#141414;
  --cmq:#f07a1e; --ccu:#b9bdc3; --otr:#686c72;
  --good:#5cc95c; --bad:#f07070; --warnbg:#3a2614; --warnink:#f7b57a;
  --sel:#33231a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--brand);color:#fff;padding:14px 20px 0;border-bottom:3px solid var(--accent)}
.hd{display:flex;align-items:center;gap:14px}
.hd img{height:46px;width:auto}
header h1 span{color:var(--accent)}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.8;margin-top:2px}
nav{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
nav button{background:transparent;border:0;color:#b5b5b5;padding:9px 14px;font-size:14px;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--accent);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
nav button:hover:not(.on){color:#fff}
.filters{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11px;color:var(--ink3)}
select,textarea,input[type=text],input[type=number],input[type=date]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px;max-width:100%}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);padding-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink2);padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--brand2);color:var(--onacc);font-weight:600}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16px}
.card .desc{color:var(--ink2);font-size:13px;margin:0 0 12px;max-width:80ch}
.row{display:flex;flex-wrap:wrap;gap:16px}
.row > .card{flex:1 1 420px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .lab{font-size:12px;color:var(--ink2)}
.kpi .val{font-size:28px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .cmp{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:1px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--ink3)}
.tw{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--soft);font-weight:600;color:var(--ink2);z-index:1;cursor:pointer;user-select:none}
th.grp{cursor:default;text-align:center;border-left:1px solid var(--line)}
td.l,th.l{text-align:left}
td.bl,th.bl{border-left:1px solid var(--line)}
tr.tot td{font-weight:700;background:var(--soft)}
tr.sub td{color:var(--ink2)}
tr.par td{font-weight:600;background:var(--soft)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sel)}
th .rz{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;z-index:3}
th .rz:hover,th .rz.on{background:var(--accent);opacity:.6}
td.wr,th.wr{white-space:normal;overflow-wrap:anywhere}
table.compact{font-size:12px} table.compact th,table.compact td{padding:4px 6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:7px;cursor:pointer}
.btn.pri{background:var(--brand2);border-color:var(--brand2);color:var(--onacc);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.note{background:var(--warnbg);color:var(--warnink);border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.muted{color:var(--ink3)}
.bar{display:inline-block;height:8px;border-radius:0 4px 4px 0;background:var(--cmq);vertical-align:middle}
.concl li{margin-bottom:7px}
.concl b{font-weight:600}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink2);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:6px 0 2px}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:6px 9px;border-radius:7px;z-index:99;display:none;max-width:280px;line-height:1.35}
.cfg input[type=text]{width:100%;min-width:140px;padding:4px 6px}
.cfg select{padding:4px 6px}
.cfg td{padding:4px 7px}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:var(--soft);color:var(--ink2)}
.hidden{display:none!important}
#tPerf td:first-child,#tPerf thead tr:last-child th:first-child{position:sticky;left:0;background:var(--card);z-index:2;box-shadow:1px 0 0 var(--line)}
#tPerf thead tr:last-child th:first-child{background:var(--soft);z-index:3}
#tPerf tr.click:hover td:first-child{background:var(--sel)}
.notas{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;resize:vertical;line-height:1.45}
a{color:var(--brand2)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;color:var(--ink2);font-size:13px}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;max-width:min(980px,94vw);width:100%;background:var(--card);color:var(--ink)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
dialog .db{padding:14px 16px;max-height:75vh;overflow:auto}
@media (max-width:700px){ main{padding:12px} .filters{padding:8px 12px} header{padding:12px 12px 0} }
.usr{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:#ddd}
.usr b{color:#fff}.usr .lk{color:var(--accent);cursor:pointer;text-decoration:underline}
.usr .adm{background:var(--accent);color:#141414;border-radius:6px;padding:1px 7px;font-weight:700}
#banner{display:none;background:var(--accent);color:#141414;padding:8px 20px;font-weight:600;font-size:13px}
#banner button{margin-left:10px}
.firma{font-size:11px;color:var(--ink3);margin-top:3px}
#boot{padding:40px 20px;text-align:center;color:var(--ink2)}
#userDlg .db button{margin:4px}
.si{color:var(--good);font-weight:700}.no{color:var(--ink3)}
.kpis-pl{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.kpis-pl .kpi{padding:6px 12px}.kpis-pl .kpi .val{font-size:18px}
#dlg.ancho{max-width:min(1400px,97vw)}
select.est{padding:2px 4px;font-size:12px} input.com{width:100%;min-width:160px;font-size:12px;padding:3px 6px}
</style>
</head>

"use strict";
// ===== Conexión Firebase (Realtime Database) =====
const FB_CONF = {"apiKey": "AIzaSyCYq7eaqQcRcOT1-hWMo9d5rsA-hRJGG30", "authDomain": "censo-thomas-lt.firebaseapp.com", "databaseURL": "https://censo-thomas-lt-default-rtdb.firebaseio.com", "projectId": "censo-thomas-lt", "storageBucket": "censo-thomas-lt.firebasestorage.app", "messagingSenderId": "790674955172", "appId": "1:790674955172:web:963217e7b972e0d426ff31"};
const FB_ROOT = 'censo';
window.CLOUD = false; window.FBDB = null; window.FB_INI = {}; window.ADMIN = false; window.USUARIO = '';
function bootMsg(h){ const b = document.getElementById('boot'); if (b) b.innerHTML = h; }
function cargarJs(u){ return new Promise((res, rej) => { const s = document.createElement('script'); s.crossOrigin = 'anonymous'; s.src = u; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + u)); document.head.appendChild(s); }); }
function partir(t){ const o = {}; for (let i = 0, n = 0; i < t.length; i += 400000, n++) o['c' + String(n).padStart(3, '0')] = t.slice(i, i + 400000); return o; }
async function sha(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('censoLT|' + t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function arrancar(){
  if (document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', arrancar, {once: true}); return; }
  const b = document.getElementById('boot'); if (b) b.remove();
  window.__PAGE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;   // copia limpia para "Descargar HTML"
  const s = document.createElement('script');
  s.textContent = document.getElementById('app').textContent;
  document.body.appendChild(s);
}
window.ETAPA = 'inicio';
setTimeout(() => { if (!window.__APP_OK) mostrarError('la página no terminó de abrir. Quedó en la etapa: ' + window.ETAPA, 'demora'); }, 20000);
(async function boot(){
  const el = document.getElementById('data');
  const txt = el.textContent.trim();
  if (txt && txt !== 'null'){ arrancar(); return; }          // foto descargada: funciona sin conexión
  try {
    window.ETAPA = 'cargando Firebase';
    const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
    await cargarJs(V + 'firebase-app-compat.js');
    await cargarJs(V + 'firebase-database-compat.js');
    firebase.initializeApp(FB_CONF);
    const db = firebase.database(); window.FBDB = db;
    window.ETAPA = 'leyendo la base';
    const g = k => db.ref(FB_ROOT + '/' + k).get().then(s => s.val());
    const [base, cfg, notas, planes, meta, pin] = await Promise.all(['base', 'cfg', 'notas', 'planes', 'meta', 'admin/pin'].map(g));
    window.ADMIN = false;
    if (location.hash.toLowerCase() === '#admin'){
      if (!pin){
        const a = prompt('Primera vez en #ADMIN. Creá un PIN para la configuración:');
        if (a && a === prompt('Repetí el PIN:')){ await db.ref(FB_ROOT + '/admin/pin').set(await sha(a)); window.ADMIN = true; }
        else alert('Los PIN no coinciden. Entrás como usuario normal.');
      } else if (sessionStorage.getItem('censoAdm') === pin) window.ADMIN = true;
      else {
        const a = prompt('PIN de administrador:');
        if (a && await sha(a) === pin){ window.ADMIN = true; try { sessionStorage.setItem('censoAdm', pin); } catch(e){} }
        else if (a !== null) alert('PIN incorrecto. Entrás como usuario normal.');
      }
    }
    // la base puede venir en un solo texto o partida en pedazos (c000, c001, …)
    let txtBase = typeof base === 'string' ? base : (base && typeof base === 'object' ? Object.keys(base).sort().map(k => base[k]).join('') : '');
    let ok = false; try { const d = JSON.parse(txtBase); ok = !!(d && d.pdv && d.facts && d.censos); } catch(e){}
    if (!ok){
      if (!window.ADMIN){ bootMsg('Todavía no hay datos cargados (o están incompletos). Avisale al analista.'); return; }
      bootMsg(`<b>${txtBase ? 'Los datos del censo en la nube están incompletos.' : 'La base está vacía.'}</b><br><br>
        Elegí el archivo <code>firebase_import_censo.json</code> (o un <code>Analisis_Censo_Thomas.html</code> con datos) y los subo desde acá:<br><br>
        <input type="file" id="iniFile" accept=".json,.html"><div id="iniMsg" style="margin-top:10px"></div>`);
      document.getElementById('iniFile').onchange = async ev => {
        const f = ev.target.files[0], msg = document.getElementById('iniMsg'); if (!f) return;
        try {
          msg.textContent = 'Leyendo ' + f.name + '…';
          const t = await f.text(); let b = null;
          if (/\.json$/i.test(f.name)){ const j = JSON.parse(t); b = j.censo && j.censo.base || j.base || (j.pdv ? JSON.stringify(j) : null); }
          else { const m = t.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/); b = m && m[1]; }
          if (b && typeof b === 'object') b = Object.keys(b).sort().map(k => b[k]).join('');
          if (typeof b !== 'string') throw new Error('No encontré los datos del censo en ese archivo.');
          const d = JSON.parse(b); if (!d.pdv || !d.facts) throw new Error('El archivo no tiene los datos del censo.');
          const notas0 = d.notas, planes0 = d.planes; delete d.notas; delete d.planes;
          b = JSON.stringify(d).replace(/<\//g, '<\\/');
          msg.textContent = 'Subiendo ' + Math.round(b.length / 1024) + ' KB…';
          const up = {base: partir(b), 'meta/ver': d.version || ('v' + Date.now()), 'meta/por': 'ANALISTA', 'meta/ts': Date.now()};
          await db.ref(FB_ROOT).update(up);
          msg.innerHTML = '<b style="color:#4caf50">Listo. Recargando…</b>'; setTimeout(() => location.reload(), 800);
        } catch (e){ msg.innerHTML = '<b style="color:#f07a1e">Error: ' + String(e.message || e).replace(/</g, '&lt;') + '</b>'; }
      };
      return;
    }
    window.ETAPA = 'dibujando el análisis (' + Math.round(txtBase.length / 1024) + ' KB)';
    el.textContent = txtBase;
    window.FB_INI = {cfg, notas: notas || {}, planes: planes || {}, ver: meta && meta.ver};
    window.CLOUD = true;
    arrancar();
  } catch (e){
    bootMsg('<b>No se pudo conectar con la base.</b><br>' + String(e.message || e).replace(/</g, '&lt;') + '<br>Revisá la conexión a internet y recargá la página.');
  }
})();
window.addEventListener('hashchange', () => location.reload());
// si algo falla, mostrarlo en pantalla en vez de dejarla vacía
function mostrarError(e, donde){
  const txt = (e && (e.stack || e.message)) || String(e);
  let b = document.getElementById('errBox');
  if (!b){ b = document.createElement('div'); b.id = 'errBox'; b.style.cssText = 'background:#2a1a10;color:#f07a1e;border:1px solid #f07a1e;border-radius:8px;margin:12px 20px;padding:10px 14px;font-size:12px;white-space:pre-wrap'; const m = document.getElementById('main'); m.parentNode.insertBefore(b, m); }
  if (!b.dataset.n){ b.dataset.n = 1; b.textContent = 'Mandale una captura de esto a Claude:\n'; } b.textContent += '\n• ' + (donde ? '[' + donde + '] ' : '') + txt.slice(0, 700);
}
function G(fn){ return function(){ try { return fn.apply(this, arguments); } catch (e){ mostrarError(e, 'actualización en vivo'); } }; }
window.addEventListener('error', ev => {
  const vacia = ((document.getElementById('main') || {}).textContent || '').trim().length < 200;
  if (ev.message === 'Script error.' && !ev.error){ if (vacia) mostrarError('falló un script externo (Firebase o una extensión del navegador). Probá en una ventana de incógnito.', 'externo'); return; }
  mostrarError(ev.error || ev.message, 'línea ' + (ev.lineno || '?'));
});
window.addEventListener('unhandledrejection', ev => window.dispatchEvent(new ErrorEvent('error', {message: 'Promesa: ' + (ev.reason && ev.reason.message || ev.reason)})));
</script>
<script id="app" type="text/plain">
"use strict";
const DATA_EL = document.getElementById('data');
const PAGE_HTML = window.__PAGE_HTML;
const ORIG_JSON = DATA_EL.textContent;
let D = JSON.parse(ORIG_JSON);
const CIDS = D.censos.map(c => c.id);              // [AA, CA, ACTUAL]
const CNAME = Object.fromEntries(D.censos.map(c => [c.id, c.nombre]));
const ACT = CIDS[CIDS.length - 1], CA = CIDS[CIDS.length - 2], AA = CIDS[CIDS.length - 3];
const EMPRESAS = ['CMQ', 'CCU', 'OTROS'];
const SEGMENTOS = ['VALUE', 'CORE', 'CORE PLUS', 'PREMIUM', 'SUPER PREMIUM', 'SIN SEGMENTO'];
const CANALES = ['K+T', 'AS', 'MAY', 'REF', 'OTRO'];
const CFG_KEY = 'censoThomasCfg:' + (D.version || D.generado);

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf0 = new Intl.NumberFormat('es-AR', {maximumFractionDigits: 0});
const nf1 = new Intl.NumberFormat('es-AR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const fHL = v => v == null || isNaN(v) ? '–' : nf0.format(v);
const fP = v => v == null || isNaN(v) ? '–' : nf1.format(v * 100) + '%';
const fPP = (v, goodUp = true) => {
  if (v == null || isNaN(v)) return '<span class="flat">–</span>';
  const pp = v * 100, r = Math.round(pp * 10) / 10;
  if (r === 0) return '<span class="flat">= 0,0</span>';
  const good = (r > 0) === goodUp;
  return `<span class="${good ? 'up' : 'down'}">${r > 0 ? '▲ +' : '▼ '}${nf1.format(r)}</span>`;
};
const fPct = (a, b, goodUp = true) => {
  if (!b) return '<span class="flat">–</span>';
  const r = Math.round((a / b - 1) * 1000) / 10;
  if (r === 0) return '<span class="flat">= 0,0%</span>';
  const good = (r > 0) === goodUp;
  return `<span class="${good ? 'up' : 'down'}">${r > 0 ? '▲ +' : '▼ '}${nf1.format(r)}%</span>`;
};
const div = (a, b) => b ? a / b : null;
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

// ---------- configuración editable ----------
let VEN = {}, SUB = {};
function loadCfg(){
  if (CLOUD){ cloudInit(); rebuildLookups(); return; }
  const saved = lsGet(CFG_KEY);
  if (saved){
    try {
      const c = JSON.parse(saved);
      if (c.maps && c.maps.length === D.maps.length) D.maps = c.maps;
      if (c.venMap) D.venMap = c.venMap;
      if (c.subMap) D.subMap = c.subMap;
      if (c.notas) D.notas = c.notas;
      if (c.planes) D.planes = c.planes;
      if (c.pdaEst) D.pdaEst = c.pdaEst;

const S = {tab: 'resumen', sinMay: false, sup: '', ven: '', canal: '', sub: '', est: '', seg: '', comunes: false,

function pdvMask(){

// SOM agrupado: key(p, m) -> {tot, CMQ, CCU, OTROS}
function aggregate(cid, ok, keyFn){

  for (let i = 0; i < f.n; i++){
    const p = f.p[i], mi = f.m[i];
    if (!ok[p] || !mapOk(mi)) continue;
    const k = keyFn(P[p], D.maps[mi]); if (k == null) continue;
    let o = out.get(k); if (!o){ o = {tot: 0, CMQ: 0, CCU: 0, OTROS: 0}; out.set(k, o); }
    o.tot += f.v[i]; o[D.maps[mi].empresa] = (o[D.maps[mi].empresa] || 0) + f.v[i];
  }

}
const DIMS = {

  marca: {lab: 'Marca', fn: (p, m) => m.marca},
  calibre: {lab: 'Calibre', fn: (p, m) => m.calibre},
  supven: {lab: 'Supervisor › Promotor', hier: [p => p.sup, p => p.ven], fld: ['sup', 'ven']},
  sup: {lab: 'Supervisor', fn: p => p.sup, fld: ['sup']},

// presencia: devuelve Float64Array con HL del "target" por PDV
function targetFn(spec){
  const [tipo, val] = spec.split(':');
  if (tipo === 'EMP') return m => m.empresa === val;
  if (tipo === 'SEG') { const [seg, emp] = val.split('|'); return m => m.segmento === seg && (!emp || m.empresa === emp); }
  if (tipo === 'MAR') return m => m.marca === val;
  if (tipo === 'CAL') { const [cal, emp] = val.split('|'); return m => m.calibre === cal && (!emp || m.empresa === emp); }
  return () => false;
}
function pdvTarget(cid, ok, pred){
  const t = new Float64Array(P.length), f = F[cid];
  for (let i = 0; i < f.n; i++){ const p = f.p[i]; if (ok[p] && mapOk(f.m[i]) && pred(D.maps[f.m[i]])) t[p] += f.v[i]; }

    o.n++; o.vol += tot[p];

function hierRows(byC, sumFn, sizeFn){
  const par = new Map();

    const [a, b] = k.split('||');

  }
  const out = [];
  const ps = [...par.entries()].map(([a, ch]) => {
    const d = {}; for (const c of CIDS) d[c] = sumFn([...ch.values()].map(x => x[c]).filter(Boolean));
    return {a, ch, d};
  }).sort((x, y) => sizeFn(y.d[ACT]) - sizeFn(x.d[ACT]));
  for (const p of ps){
    out.push({k: p.a, d: p.d, _cls: 'par', nivel: 1});
    [...p.ch.entries()].map(([b, x]) => ({k: b, d: Object.fromEntries(CIDS.map(c => [c, x[c] || sumFn([])])), _cls: 'sub', nivel: 2}))
      .filter(r => CIDS.some(c => sizeFn(r.d[c]) > 0))

function csvTable(id){
  const t = document.getElementById(id); if (!t) return;
  const lines = [...t.querySelectorAll('tr')].map(tr => [...tr.children].map(td => {
    const tmp = document.createElement('div'); tmp.innerHTML = td.innerHTML.replace(/<br\s*\/?>/gi, ' ');
    let s = tmp.textContent.replace(/[▲▼↑↓]/g, '').replace(/\s+/g, ' ').trim();
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';'));
  descargar(id + '.csv', '﻿' + lines.join('\r\n'), 'text/csv');
}
function descargar(nombre, contenido, tipo){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenido], {type: tipo + ';charset=utf-8'}));
  a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

// ---------- RESUMEN ----------
function kpi(lab, vals, fmt, isPct, extra = ''){
  const [a, b, c] = [vals[AA], vals[CA], vals[ACT]];
  const d1 = isPct ? fPP(sub(c, b)) : fPct(c, b), d2 = isPct ? fPP(sub(c, a)) : fPct(c, a);
  return `<div class="kpi"><div class="lab">${lab}</div><div class="val">${fmt(c)}</div>
    <div class="cmp"><span>vs ${CA} (${fmt(b)}): ${d1}${isPct ? ' pp' : ''}</span><span>vs ${AA} (${fmt(a)}): ${d2}${isPct ? ' pp' : ''}</span>${extra}</div></div>`;
}
function rResumen(){
  const ok = pdvMask();
  const T = {}, DN = {}, NP = {};
  for (const c of CIDS){
    T[c] = totalAll(c, ok);
    const d = distrib(c, ok, targetFn('EMP:CMQ'), null).get('TOTAL') || {};
    DN[c] = d; NP[c] = d.n || 0;
  }
  const som = Object.fromEntries(CIDS.map(c => [c, div(T[c].CMQ, T[c].tot)]));
  let h = avisoUniverso();
  h += `<div class="kpis">
    ${kpi('Share of Market CMQ', som, fP, true)}
    ${kpi('Mercado de cerveza (HL)', Object.fromEntries(CIDS.map(c => [c, T[c].tot])), fHL, false)}
    ${kpi('Volumen CMQ (HL)', Object.fromEntries(CIDS.map(c => [c, T[c].CMQ])), fHL, false)}
    ${kpi('PDV con venta de cerveza', NP, fHL, false)}
    ${kpi('Distribución física CMQ', Object.fromEntries(CIDS.map(c => [c, DN[c].DN])), fP, true)}
    ${kpi('Distribución ponderada CMQ', Object.fromEntries(CIDS.map(c => [c, DN[c].DP])), fP, true)}
  </div>`;
  // gráfico 1: mix por compañía (barras 100%)
  const W = 640, rowH = 34, x0 = 70;
  let svg = `<svg viewBox="0 0 ${W} ${CIDS.length * rowH + 10}" role="img" aria-label="Participación por compañía en cada censo">`;
  CIDS.forEach((c, i) => {
    const t = T[c]; let x = x0; const y = i * rowH + 4, w = W - x0 - 10;
    svg += `<text x="0" y="${y + 17}">${c}</text>`;
    EMPRESAS.forEach((e, j) => {
      const sh = div(t[e], t.tot) || 0, ww = Math.max(0, sh * w - (j < 2 ? 2 : 0));
      if (ww > 0){
        svg += `<rect x="${x}" y="${y}" width="${ww}" height="24" rx="${j === 2 ? 4 : 0}" fill="var(--${e === 'CMQ' ? 'cmq' : e === 'CCU' ? 'ccu' : 'otr'})" data-tip="<b>${c} · ${e}</b><br>${fP(sh)} del mercado<br>${fHL(t[e])} HL"></rect>`;
        if (sh > .07) svg += `<text x="${x + 6}" y="${y + 16}" style="fill:var(--onacc);font-weight:600">${fP(sh)}</text>`;
      }
      x += sh * w;
    });
  });
  svg += '</svg>';
  const leg = `<div class="legend">${EMPRESAS.map(e => `<span><span class="dot" style="background:var(--${e === 'CMQ' ? 'cmq' : e === 'CCU' ? 'ccu' : 'otr'})"></span>${e}</span>`).join('')}</div>`;
  // gráfico 2: SOM por segmento (puntos por censo)
  const segAgg = Object.fromEntries(CIDS.map(c => [c, aggregate(c, ok, (p, m) => m.segmento)]));
  const segs = SEGMENTOS.filter(s => s !== 'SIN SEGMENTO' && CIDS.some(c => segAgg[c].has(s)));
  const H2 = segs.length * 34 + 30, xs = v => 120 + v * (W - 140);
  let svg2 = `<svg viewBox="0 0 ${W} ${H2}" role="img" aria-label="SOM CMQ por segmento en los 3 censos">`;
  [0, .25, .5, .75, 1].forEach(g => { svg2 += `<line x1="${xs(g)}" x2="${xs(g)}" y1="0" y2="${H2 - 22}" stroke="var(--line)"/><text x="${xs(g)}" y="${H2 - 6}" text-anchor="middle">${g * 100}%</text>`; });
  const shp = {[AA]: 'var(--otr)', [CA]: 'var(--ccu)', [ACT]: 'var(--cmq)'};
  segs.forEach((s, i) => {
    const y = i * 34 + 16;
    svg2 += `<text x="0" y="${y + 4}">${s}</text>`;
    const vals = CIDS.map(c => { const o = segAgg[c].get(s); return o ? div(o.CMQ, o.tot) : null; });
    const vv = vals.filter(v => v != null);
    if (vv.length > 1) svg2 += `<line x1="${xs(Math.min(...vv))}" x2="${xs(Math.max(...vv))}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="3"/>`;
    CIDS.forEach((c, j) => { if (vals[j] != null) svg2 += `<circle cx="${xs(vals[j])}" cy="${y}" r="${c === ACT ? 7 : 5.5}" fill="${shp[c]}" stroke="var(--card)" stroke-width="2" data-tip="<b>${s} · ${c}</b><br>SOM ${fP(vals[j])}"></circle>`; });
    if (vals[2] != null) svg2 += `<text x="${xs(vals[2])}" y="${y - 10}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fP(vals[2])}</text>`;
  });
  svg2 += '</svg>';
  const leg2 = `<div class="legend">${CIDS.map(c => `<span><span class="dot" style="background:${shp[c]}"></span>${CNAME[c]}</span>`).join('')}</div>`;
  h += `<div class="row">
    <div class="card chart"><h2>Participación por compañía</h2><p class="desc">Mix del mercado de cerveza censado en cada censo.</p>${leg}${svg}</div>
    <div class="card chart"><h2>SOM CMQ por segmento</h2><p class="desc">Cada punto es un censo. El valor arriba es el censo actual.</p>${leg2}${svg2}</div></div>`;
  // calidad de datos
  h += `<div class="card"><h2>Notas de calidad de datos</h2><ul class="concl">${calidadNotas().map(n => `<li>${n}</li>`).join('')}</ul></div>`;
  return h;
}
function calidadNotas(){
  const n = D.calidad.map(c => `<b>${esc(c.censo)}</b> · ${esc(c.tipo)}: ${esc(c.detalle)}`);
  n.push('Corona, Patagonia, Michelob y 0.0% vienen en septiembre como "total calibres": en la apertura por calibre se muestran como TOTAL CALIBRES en los 3 censos para que sean comparables.');

  const TT = Object.fromEntries(CIDS.map(c => [c, totalAll(c, ok)]));
  const keys = new Set(); CIDS.forEach(c => A[c].forEach((v, k) => keys.add(k)));
  const esMarca = S.somDim === 'marca';
  let rows = dim.hier ? hierRows(A, sumAgg, o => o.tot) : [...keys].map(k => ({k, d: Object.fromEntries(CIDS.map(c => [c, A[c].get(k) || {tot: 0, CMQ: 0, CCU: 0, OTROS: 0}]))}));
  rows.forEach(r => {
    if (dim.fld) r._drill = dim.fld[(r.nivel || 1) - 1] + '\u0001' + r.k;
    else r._drill = S.somDim + '\u0001' + r.k;
  });
  if (dim.hier) {}
  else if (dim.orden) rows.sort((a, b) => dim.orden.indexOf(a.k) - dim.orden.indexOf(b.k));
  else rows.sort((a, b) => b.d[ACT].tot - a.d[ACT].tot);
  const emp = r => { const m = D.maps.find(x => x.marca === r.k); return m ? m.empresa : 'CMQ'; };
  let cols, desc;

 cols = [{lab: 'Marca', l: true, fn: r => r.k === 'TOTAL' ? 'TOTAL' : `<span class="dot" style="background:var(--${emp(r) === 'CMQ' ? 'cmq' : emp(r) === 'CCU' ? 'ccu' : 'otr'})"></span>${esc(r.k)}`, sv: r => r.k},
      {lab: 'Compañía', l: true, fn: r => r.k === 'TOTAL' ? '' : emp(r), sv: r => emp(r)},

    rows.forEach(r => { r._cls = ''; });

    : dim.hier ? `SOM = HL CMQ / HL total de cerveza. Cada ${dim.lab.split(' › ')[0].toLowerCase()} con su apertura abajo (según la base de clientes actual). Hacé clic en cualquier fila para ver su SOM por segmento y por marca.`
    : `SOM = HL CMQ / HL total de cerveza en los PDV de cada ${dim.lab.toLowerCase()} (vendedor, supervisor y canal según la base de clientes actual). Hacé clic en una fila para ver su SOM por segmento y por marca.`;
  cols = [{lab: dim.lab, l: true, fn: r => indent(r) + esc(r.k), sv: r => r.k},

// ---------- DETALLE AL HACER CLIC (Share of Market) ----------
function drill(spec){
  const [dim, val] = spec.split('\u0001');
  const base = pdvMask();
  const z = {tot: 0, CMQ: 0, CCU: 0, OTROS: 0};
  const empOf = k => (D.maps.find(x => x.marca === k) || {}).empresa || 'OTROS';
  const dot = e => `<span class="dot" style="background:var(--${e === 'CMQ' ? 'cmq' : e === 'CCU' ? 'ccu' : 'otr'})"></span>`;
  const pick = (A, k) => Object.fromEntries(CIDS.map(c => [c, A[c].get(k) || z]));
  let titulo, html = '';
  const shareTbl = (id, lab, rows, denom, opts = {}) => table(id, [
    {lab, l: true, fn: r => (opts.dot ? dot(empOf(r.k)) : '') + esc(r.k), sv: r => r.k},
    {lab: 'HL ' + ACT, fn: r => fHL(r.d[ACT].tot ?? r.d[ACT]), sv: r => r.d[ACT].tot ?? r.d[ACT]},
    ...cols3(opts.lab || 'Share', (r, c) => denom(r, c), fP, {goodUp: r => !opts.dot || empOf(r.k) === 'CMQ'})], rows,
    {groups: [['', 2], [opts.grp || 'Share (%)', 3], ['Variación (pp)', 2]]});
  if (['sup', 'ven', 'canal', 'sub'].includes(dim)){
    const ok = base.map((v, i) => v && P[i][dim] === val ? 1 : 0);
    const nom = {sup: 'Supervisor', ven: 'Promotor', canal: 'Canal', sub: 'Subcanal'}[dim];
    titulo = `${nom}: ${val}`;
    const TT = Object.fromEntries(CIDS.map(c => [c, totalAll(c, ok)]));
    const sA = Object.fromEntries(CIDS.map(c => [c, aggregate(c, ok, (p, m) => m.segmento)]));
    const segs = SEGMENTOS.filter(s => CIDS.some(c => sA[c].has(s))).map(s => ({k: s, d: pick(sA, s)}));
    const tSeg = table('tDrSeg', [{lab: 'Segmento', l: true, fn: r => esc(r.k)},
      {lab: 'HL ' + ACT, fn: r => fHL(r.d[ACT].tot)}, {lab: 'Mix ' + ACT, fn: r => fP(div(r.d[ACT].tot, TT[ACT].tot))},
      ...cols3('SOM', (r, c) => div(r.d[c].CMQ, r.d[c].tot), fP)], segs,
      {groups: [['', 3], ['SOM CMQ dentro del segmento', 3], ['Variación (pp)', 2]], total: {k: 'TOTAL', d: TT}, nosort: true});
    const mA = Object.fromEntries(CIDS.map(c => [c, aggregate(c, ok, (p, m) => m.marca)]));
    const keys = new Set(); CIDS.forEach(c => mA[c].forEach((v, k) => keys.add(k)));
    const mrows = [...keys].map(k => ({k, d: pick(mA, k)})).sort((a, b) => b.d[ACT].tot - a.d[ACT].tot);
    const tMar = shareTbl('tDrMar', 'Marca', mrows, (r, c) => div(r.d[c].tot, TT[c].tot), {dot: true, grp: 'Share de marca sobre su mercado (%)'});
    const pdvs = ok.reduce((s, v) => s + v, 0);
    html = `<div class="kpis">${kpi('SOM CMQ', Object.fromEntries(CIDS.map(c => [c, div(TT[c].CMQ, TT[c].tot)])), fP, true)}
      ${kpi('Mercado (HL)', Object.fromEntries(CIDS.map(c => [c, TT[c].tot])), fHL, false)}</div>

    const keys = new Set(); CIDS.forEach(c => mA[c].forEach((v, k) => keys.add(k)));
    const rows = [...keys].map(k => ({k, d: pick(mA, k), cal: pick(cA, k)})).sort((a, b) => b.d[ACT].tot - a.d[ACT].tot);
    const tot = Object.fromEntries(CIDS.map(c => [c, [...mA[c].values()].reduce((s, o) => s + o.tot, 0)]));
    html = `<p class="desc">HL de ${esc(val)} en cada calibre, cuánto pesa cada calibre dentro de la marca y qué share tiene la marca dentro del mercado de ese calibre.</p>` +
      table('tDrCal', [{lab: 'Calibre', l: true, fn: r => esc(r.k)},
        ...CIDS.map((c, j) => ({lab: (j === 0 ? 'HL ' : '') + c, bl: j === 0, fn: r => fHL(r.d[c].tot)})),
        {lab: 'Δ HL vs ' + CA, fn: r => fPct(r.d[ACT].tot, r.d[CA].tot)},
        ...CIDS.map((c, j) => ({lab: (j === 0 ? 'Mix ' : '') + c, bl: j === 0, fn: r => fP(div(r.d[c].tot, tot[c]))})),
        ...cols3('Share', (r, c) => div(r.d[c].tot, r.cal[c].tot), fP, {goodUp: () => empOf(val) === 'CMQ'}).map((x, i) => i === 0 ? {...x, bl: true} : x)],
        rows, {groups: [['', 1], ['HL de la marca', 4], ['Peso del calibre en la marca', 3], ['Share de la marca en el calibre', 5]], nosort: true});
  } else if (dim === 'calibre' || dim === 'segmento'){

    const mA = Object.fromEntries(CIDS.map(c => [c, aggregate(c, base, (p, m) => m[f] === val ? m.marca : null)]));
    const T = Object.fromEntries(CIDS.map(c => [c, [...mA[c].values()].reduce((s, o) => s + o.tot, 0)]));
    const keys = new Set(); CIDS.forEach(c => mA[c].forEach((v, k) => keys.add(k)));
    const rows = [...keys].map(k => ({k, d: pick(mA, k)})).sort((a, b) => b.d[ACT].tot - a.d[ACT].tot);
    html = `<p class="desc">Share de cada marca dentro del ${dim === 'calibre' ? 'calibre' : 'segmento'} ${esc(val)}. En marcas de la competencia, que suba se marca en rojo.</p>` +

        {lab: 'Compañía', l: true, fn: r => empOf(r.k)},

        rows, {groups: [['', 2], ['HL', 3], ['Share dentro del ' + dim + ' (%)', 3], ['Variación (pp)', 2]], nosort: true});
  } else return;
  $('#dlgT').textContent = titulo;
  $('#dlgB').innerHTML = html;
  if (!$('#dlg').open) $('#dlg').showModal();
}

  const segA = Object.fromEntries(CIDS.map(c => [c, aggregate(c, ok, (p, m) => m.segmento)]));
  const TT = Object.fromEntries(CIDS.map(c => [c, totalAll(c, ok)]));
  const segs = SEGMENTOS.filter(s => CIDS.some(c => segA[c].has(s)));
  const z = {tot: 0, CMQ: 0, CCU: 0, OTROS: 0};
  const rows = segs.map(s => ({k: s, d: Object.fromEntries(CIDS.map(c => [c, segA[c].get(s) || z]))}));
  const t1 = table('tMix', [{lab: 'Segmento', l: true, fn: r => esc(r.k), sv: r => SEGMENTOS.indexOf(r.k)},
    {lab: 'HL ' + ACT, fn: r => fHL(r.d[ACT].tot), sv: r => r.d[ACT].tot},

    rows, {groups: [['', 2], ['Mix del segmento (% del total cerveza)', 5], ['Share CMQ dentro del segmento', 5]]});

  const t2 = table('tSosMarca', [{lab: 'Marca', l: true, fn: r => `<span class="dot" style="background:var(--${emp(r.k) === 'CMQ' ? 'cmq' : emp(r.k) === 'CCU' ? 'ccu' : 'otr'})"></span>${esc(r.k)}`, sv: r => r.k},
    {lab: 'Compañía', l: true, fn: r => emp(r.k), sv: r => emp(r.k)},
    {lab: 'HL ' + ACT, fn: r => fHL(r.d[ACT]), sv: r => r.d[ACT]},

  return avisoUniverso() + `<div class="card"><h2>Share of Segment — mix y share por segmento</h2>
    <p class="desc">Peso de cada segmento en el total cerveza (mix) y participación de CMQ dentro de cada uno, contra el censo anterior y el año anterior.</p>${t1}</div>
    <div class="card"><h2>Apertura por marca dentro del segmento</h2>

// ---------- DISTRIBUCIÓN ----------
function targetsList(){
  const marcas = [...new Set(D.maps.filter(m => m.incluir).map(m => m.marca))].sort();
  return [['EMP:CMQ', 'Total cervezas CMQ'], ['EMP:CCU', 'Total cervezas CCU'],
    ...SEGMENTOS.filter(s => s !== 'SIN SEGMENTO').map(s => ['SEG:' + s + '|CMQ', 'Segmento ' + s + ' (CMQ)']),
    ...marcas.map(m => ['MAR:' + m, 'Marca ' + m])];
}
function rDist(){
  const ok = pdvMask(), met = S.dist;
  const metLab = met === 'DN' ? 'Distribución física' : 'Distribución ponderada';
  const metDesc = met === 'DN'
    ? 'Distribución física = % de los PDV que venden cerveza (con volumen en el censo) donde la marca está presente.'
    : 'Distribución ponderada = volumen total de cerveza de los PDV donde la marca está presente, sobre el volumen total de cerveza del universo. Mide qué tan "pesados" son los PDV donde estamos.';
  // 1) por segmento y marca
  const marcas = [...new Set(D.maps.filter(m => m.incluir && (!S.seg || m.segmento === S.seg)).map(m => m.marca))];
  const empOf = k => (D.maps.find(x => x.marca === k) || {}).empresa || 'OTROS';
  const segOf = k => (D.maps.find(x => x.marca === k) || {}).segmento || '';
  const filas = [];
  filas.push({k: 'Total cervezas CMQ', spec: 'EMP:CMQ', emp: 'CMQ', nivel: 0});
  filas.push({k: 'Total cervezas CCU', spec: 'EMP:CCU', emp: 'CCU', nivel: 0});
  SEGMENTOS.filter(s => s !== 'SIN SEGMENTO' && (!S.seg || s === S.seg)).forEach(s => {
    filas.push({k: s + ' — CMQ', spec: 'SEG:' + s + '|CMQ', emp: 'CMQ', nivel: 1, seg: s});
    filas.push({k: s + ' — CCU', spec: 'SEG:' + s + '|CCU', emp: 'CCU', nivel: 1, seg: s});
    marcas.filter(m => segOf(m) === s).sort((a, b) => (empOf(a) > empOf(b) ? 1 : empOf(a) < empOf(b) ? -1 : a < b ? -1 : 1))
      .forEach(m => filas.push({k: m, spec: 'MAR:' + m, emp: empOf(m), nivel: 2, seg: s}));
  });
  const cache = {};
  filas.forEach(f => { f.d = Object.fromEntries(CIDS.map(c => [c, (distrib(c, ok, targetFn(f.spec), null).get('TOTAL') || {})])); f._cls = f.nivel === 0 ? 'tot' : f.nivel === 1 ? '' : 'sub'; });
  const filas2 = filas.filter(f => CIDS.some(c => (f.d[c].nPres || 0) > 0) || f.nivel < 2);
  const t1 = table('tDist1', [{lab: 'Segmento / marca', l: true, fn: r => (r.nivel === 2 ? '&nbsp;&nbsp;&nbsp;' : '') + `<span class="dot" style="background:var(--${r.emp === 'CMQ' ? 'cmq' : r.emp === 'CCU' ? 'ccu' : 'otr'})"></span>${esc(r.k)}`},
    {lab: 'PDV con marca ' + ACT, fn: r => fHL(r.d[ACT].nPres)},
    ...cols3(met, (r, c) => r.d[c][met], fP, {goodUp: r => r.emp === 'CMQ'})], filas2,
    {groups: [['', 2], [metLab + ' (%)', 3], ['Variación (pp)', 2]]});
  // 2) por supervisor/promotor/canal/subcanal (target elegible)
  const dims = {supven: 'Supervisor › Promotor', sup: 'Supervisor', ven: 'Promotor', canalsub: 'Canal › Subcanal', canal: 'Canal', sub: 'Subcanal'};
  if (!dims[S.distDim]) S.distDim = 'supven';
  const dd = DIMS[S.distDim];
  const gfn = dd.hier ? (p => dd.hier[0](p) + '||' + dd.hier[1](p)) : dd.fn;
  const pred = targetFn(S.distTarget);
  const G = Object.fromEntries(CIDS.map(c => [c, distrib(c, ok, pred, gfn)]));
  const keys = new Set(); CIDS.forEach(c => G[c].forEach((v, k) => keys.add(k)));
  const rows2 = dd.hier ? hierRows(G, sumDist, o => o.vol || 0)
    : [...keys].map(k => ({k, d: Object.fromEntries(CIDS.map(c => [c, G[c].get(k) || {}]))})).sort((a, b) => (b.d[ACT].vol || 0) - (a.d[ACT].vol || 0));
  const tot = {k: 'TOTAL', d: Object.fromEntries(CIDS.map(c => [c, distrib(c, ok, pred, null).get('TOTAL') || {}]))};
  const t2 = table('tDist2', [{lab: dims[S.distDim], l: true, fn: r => indent(r) + esc(r.k), sv: r => r.k},
    {lab: 'PDV ' + ACT, fn: r => fHL(r.d[ACT].n), sv: r => r.d[ACT].n || 0},
    {lab: 'PDV con marca', fn: r => fHL(r.d[ACT].nPres), sv: r => r.d[ACT].nPres || 0},
    ...cols3(met, (r, c) => r.d[c][met], fP)], rows2, {groups: [['', 3], [metLab + ' (%)', 3], ['Variación (pp)', 2]], total: tot, nosort: !!dd.hier});
  setTimeout(() => {
    document.querySelectorAll('#distMet button').forEach(x => x.onclick = () => { S.dist = x.dataset.v; render(); });
    document.querySelectorAll('#distDim button').forEach(x => x.onclick = () => { S.distDim = x.dataset.v; render(); });
    const t = $('#distTg'); if (t) t.onchange = e => { S.distTarget = e.target.value; render(); };
  });
  return avisoUniverso() + `<div class="card"><div class="tools"><div class="seg" id="distMet">
      <button data-v="DN" class="${met === 'DN' ? 'on' : ''}">Distribución física</button>
      <button data-v="DP" class="${met === 'DP' ? 'on' : ''}">Distribución ponderada</button></div></div>
    <p class="desc">${metDesc}</p></div>
    <div class="card"><h2>${metLab} por segmento y marca</h2>${t1}</div>
    <div class="card"><h2>${metLab} por ${dims[S.distDim].toLowerCase()}</h2><p class="desc">Universo = PDV con volumen de cerveza en cada censo, según su supervisor, promotor y canal actuales.</p>
      <div class="tools"><div class="seg" id="distDim">${Object.entries(dims).map(([k, l]) => `<button data-v="${k}" class="${S.distDim === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <span class="muted">Medir:</span><select id="distTg">${targetsList().map(([v, l]) => `<option value="${esc(v)}" ${v === S.distTarget ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
      ${t2}</div>`;
}

// ---------- CONCLUSIONES ----------
function rOpo(){
  const ok = pdvMask();
  const z = {tot: 0, CMQ: 0, CCU: 0, OTROS: 0};
  const by = (fn) => Object.fromEntries(CIDS.map(c => [c, aggregate(c, ok, fn)]));
  const pp = v => v == null ? '–' : (v >= 0 ? '+' : '') + nf1.format(v * 100) + ' pp';
  const linea = (k, d) => {
    const s = div(d[ACT].CMQ, d[ACT].tot), sCA = div(d[CA].CMQ, d[CA].tot), sAA = div(d[AA].CMQ, d[AA].tot);
    return {k, som: s, dCA: sub(s, sCA), dAA: sub(s, sAA), comp: d[ACT].CCU + d[ACT].OTROS, tot: d[ACT].tot, mix: 0};
  };
  // segmentos
  const sA = by((p, m) => m.segmento);
  const segs = SEGMENTOS.filter(s => s !== 'SIN SEGMENTO' && sA[ACT].has(s)).map(s => linea(s, Object.fromEntries(CIDS.map(c => [c, sA[c].get(s) || z])))).sort((a, b) => b.comp - a.comp);
  // subcanales
  const cA = by(p => p.sub);
  const subs = [...cA[ACT].keys()].map(s => linea(s, Object.fromEntries(CIDS.map(c => [c, cA[c].get(s) || z])))).filter(x => x.tot >= 30).sort((a, b) => b.comp - a.comp);
  // marcas vs competencia por segmento
  const mA = by((p, m) => m.segmento + '|' + m.marca);
  const tSeg = by((p, m) => m.segmento);
  const empOf = k => (D.maps.find(x => x.marca === k) || {}).empresa || 'OTROS';
  const marcas = [];
  for (const k of new Set([...mA[ACT].keys(), ...mA[CA].keys()])){
    const [seg, mar] = k.split('|'); if (seg === 'SIN SEGMENTO') continue;
    const sh = c => div((mA[c].get(k) || z).tot, (tSeg[c].get(seg) || z).tot);
    marcas.push({seg, mar, emp: empOf(mar), sh: sh(ACT), dCA: sub(sh(ACT), sh(CA)), dAA: sub(sh(ACT), sh(AA)), hl: (mA[ACT].get(k) || z).tot});
  }
  const compSube = marcas.filter(m => m.emp !== 'CMQ' && m.dCA > 0.005).sort((a, b) => b.dCA - a.dCA).slice(0, 6);
  const cmqBaja = marcas.filter(m => m.emp === 'CMQ' && m.dCA < -0.005).sort((a, b) => a.dCA - b.dCA).slice(0, 6);
  const cmqSube = marcas.filter(m => m.emp === 'CMQ' && m.dCA > 0.005).sort((a, b) => b.dCA - a.dCA).slice(0, 4);
  // clientes
  const cli = clientesCalc(ok).filter(c => c.comp > 0).sort((a, b) => b.comp - a.comp);
  const top = cli.slice(0, 10);
  const compTot = cli.reduce((s, c) => s + c.comp, 0), compTop20 = cli.slice(0, Math.ceil(cli.length * .2)).reduce((s, c) => s + c.comp, 0);
  const li = arr => arr.map(x => `<li>${x}</li>`).join('');
  let h = avisoUniverso() + notasEquipo() + `<div class="note" style="background:var(--sel);color:var(--ink)">Estas conclusiones se arman solas con los filtros de arriba (podés filtrar por supervisor o canal y se recalculan). Usalas como punto de partida para el documento del PDA.</div>`;
  h += `<div class="row"><div class="card"><h2>Oportunidades por segmento</h2><p class="desc">Ordenado por HL de competencia (lo que queda por ganar).</p><ul class="concl">${li(segs.map(s =>
    `<b>${esc(s.k)}</b>: SOM ${fP(s.som)} (${pp(s.dCA)} vs ${CA}, ${pp(s.dAA)} vs ${AA}). Competencia: <b>${fHL(s.comp)} HL</b>.`))}</ul></div>
    <div class="card"><h2>Oportunidades por canal</h2><p class="desc">Subcanales con más de 30 HL de mercado, ordenados por HL de competencia.</p><ul class="concl">${li(subs.slice(0, 8).map(s =>
    `<b>${esc(s.k)}</b>: SOM ${fP(s.som)} (${pp(s.dCA)} vs ${CA}). Competencia: <b>${fHL(s.comp)} HL</b>.`))}</ul></div></div>`;
  h += `<div class="row"><div class="card"><h2>Marcas vs competencia</h2><p class="desc">Share dentro de su segmento, variación vs ${CNAME[CA]}.</p>
    <p><b>Competencia que gana terreno</b></p><ul class="concl">${li(compSube.map(m => `${esc(m.mar)} (${m.emp}) en ${m.seg}: ${fP(m.sh)} del segmento, <span class="down">${pp(m.dCA)}</span>`)) || '<li class="muted">Ninguna marca de la competencia creció más de 0,5 pp.</li>'}</ul>
    <p><b>Marcas CMQ que pierden share</b></p><ul class="concl">${li(cmqBaja.map(m => `${esc(m.mar)} en ${m.seg}: ${fP(m.sh)}, <span class="down">${pp(m.dCA)}</span>`)) || '<li class="muted">Ninguna marca CMQ cayó más de 0,5 pp.</li>'}</ul>
    <p><b>Marcas CMQ que ganan share</b></p><ul class="concl">${li(cmqSube.map(m => `${esc(m.mar)} en ${m.seg}: ${fP(m.sh)}, <span class="up">${pp(m.dCA)}</span>`)) || '<li class="muted">–</li>'}</ul></div>
    <div class="card"><h2>Clientes con grandes oportunidades</h2><p class="desc">El 20% de los PDV con más competencia concentra <b>${fP(div(compTop20, compTot))}</b> del volumen de competencia (${fHL(compTop20)} de ${fHL(compTot)} HL). Top 10:</p>
    <ul class="concl">${li(top.map(c => `<a href="#" onclick="verPdv(${c.i});return false">${esc(P[c.i].rs)}</a> <span class="muted">(${esc(P[c.i].ven)})</span>: ${fHL(c.comp)} HL de competencia, SOM ${fP(c.som)}`))}</ul>
    <p class="muted">La lista completa está más abajo, en el universo del PDA.</p></div></div>`;
  h += pdaUniverso(ok) + planesAccion();
  return h;
}

// ---------- UNIVERSO DEL PDA Y PLANES DE ACCIÓN ----------
S.pdaCfg = S.pdaCfg || {minComp: 5, maxSom: 60, caida: 10, minHL: 2};
const PDA_TIPOS = {Conquistar: 'Mucho volumen de competencia y SOM bajo', Recuperar: 'SOM que cayó fuerte vs el censo anterior', Distribuir: 'Compran el segmento a la competencia y no tienen marca CMQ en ese segmento'};
const PDA_SEGS = ['VALUE', 'CORE', 'CORE PLUS', 'PREMIUM'];
function pdaCalc(ok){
  const c = S.pdaCfg, tot = {}, cmq = {};
  for (const x of [ACT, CA]){ tot[x] = pdvTot(x, ok); cmq[x] = pdvTarget(x, ok, m => m.empresa === 'CMQ'); }
  const sc = {}, sq = {};
  PDA_SEGS.forEach(s => { sc[s] = pdvTarget(ACT, ok, m => m.segmento === s && m.empresa !== 'CMQ'); sq[s] = pdvTarget(ACT, ok, m => m.segmento === s && m.empresa === 'CMQ'); });
  const out = [];

// ---------- base de ventas mensual ----------
function leerVentas(A, mesSel){
  let hr = -1, H = null;
  for (let r = 0; r < Math.min(20, A.length); r++){
    const h = (A[r] || []).map(v => SINT(UP(v == null ? '' : String(v))));
    if (h.some(x => /CLIENTE|^POC|CONCAT DISTRIS/.test(x))){ hr = r; H = h; break; }
  }
  if (hr < 0) throw new Error('No encontré la columna del cliente (un encabezado que diga "Cliente").');
  const body = A.slice(hr + 1, hr + 301);
  const numerica = j => body.filter(r => r && /^\d{3,}$/.test(String(r[j] ?? '').trim().split('.')[0])).length;
  const cands = H.map((x, j) => /CLIENTE|^POC|CONCAT DISTRIS/.test(x) ? j : -1).filter(j => j >= 0);
  const cCli = cands.sort((a, b) => numerica(b) - numerica(a) || (/COD/.test(H[b]) ? 1 : 0) - (/COD/.test(H[a]) ? 1 : 0))[0];
  if (!numerica(cCli)) throw new Error('La columna "' + H[cCli] + '" no tiene códigos de cliente numéricos.');
  const busca = (...res) => { for (const re of res){ const j = H.findIndex(x => re.test(x)); if (j >= 0) return j; } return -1; };
  const cMar = busca(/^MARCA$/, /MARCA/, /ARTICULO|PRODUCTO|DESCRIPCION ART/);
  const cSeg = busca(/SEGMENTO/), cNeg = busca(/NEGOCIO/);
  const cPer = busca(/DESCRIPCION PERIODO|FECHA DEL PERIODO/, /PERIODO/, /^MES$|^MES /, /FECHA/);
  const cQty = busca(/^HL$|HECTOLITRO/, /CANTIDAD/, /BULTOS/, /LITROS/, /VOLUMEN|UNIDADES/);
  if (cMar < 0 && cSeg < 0) throw new Error('No encontré una columna de Marca (o Segmento) para saber qué compró cada cliente.');
  const X = window.XLSX;
  const mesDe = v => {
    if (v == null || v === '') return null;
    if (v instanceof Date) return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0');
    if (/^20\d{2}(0[1-9]|1[0-2])$/.test(String(v).trim())) return String(v).trim().slice(0, 4) + '-' + String(v).trim().slice(4, 6);
    if (typeof v === 'number' && v > 30000 && v < 80000 && X){ const d = X.SSF.parse_date_code(v); return d ? d.y + '-' + String(d.m).padStart(2, '0') : null; }
    const s = SINT(String(v).toUpperCase()); let m;
    if ((m = s.match(/(\d{4})[-\/.](\d{1,2})/))) return m[1] + '-' + m[2].padStart(2, '0');
    if ((m = s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) return m[3] + '-' + m[2].padStart(2, '0');
    if ((m = s.match(/(\d{1,2})[-\/.](\d{4})/))) return m[2] + '-' + m[1].padStart(2, '0');
    const meses = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
    const k = meses.findIndex(x => s.includes(x)); const y = s.match(/(20\d{2})/) || s.match(/\b(\d{2})\b/);
    if (k >= 0 && y) return (y[1].length === 2 ? '20' + y[1] : y[1]) + '-' + String(k + 1).padStart(2, '0');
    return null;
  };
  const IM = infoMarcas(), out = {}, sinMap = {};
  let filas = 0, usadas = 0, sinMes = 0;
  for (const r of A.slice(hr + 1)){
    if (!r) continue;
    const cid = canonId(r[cCli]); if (!cid) continue;
    filas++;
    if (cNeg >= 0 && r[cNeg] != null && !/CERVEZ|CZA/.test(SINT(UP(r[cNeg])))) continue;
    const q = cQty >= 0 ? (typeof r[cQty] === 'number' ? r[cQty] : parseFloat(String(r[cQty] ?? '').replace(/\./g, '').replace(',', '.'))) : 1;
    if (!(q > 0)) continue;
    let key = null;
    const nom = cMar >= 0 ? SINT(UP(r[cMar])).replace(/^CERVEZAS? /, '') : '';
    if (nom && Object.prototype.hasOwnProperty.call(D.ventaMap, nom)) key = D.ventaMap[nom] || '';
    else if (nom){
      const rg = REGLAS.find(x => x[0].test(nom));
      if (rg && rg[2] === 'CMQ' && rg[4]) key = rg[1];
      else if (IM[nom] && IM[nom].emp === 'CMQ') key = nom;
    }
    if (key === null && cSeg >= 0){ const sg = SINT(UP(r[cSeg])); if (SEGMENTOS.includes(sg)) key = '~SEG:' + sg; }
    if (key === null){ if (nom) sinMap[nom] = (sinMap[nom] || 0) + q; continue; }
    if (key === '') continue;
    const mes = (cPer >= 0 ? mesDe(r[cPer]) : null) || mesSel;
    if (!mes){ sinMes++; continue; }
    const o = (out[mes] = out[mes] || {}), c = (o[cid] = o[cid] || {});
    c[key] = Math.round(((c[key] || 0) + q) * 1000) / 1000; usadas++;
  }
  if (!Object.keys(out).length) throw new Error(sinMes ? 'El archivo no trae el mes: elegilo en "Mes de la venta" y volvé a subirlo.' : 'No encontré ventas de cerveza CMQ en el archivo.');
  return {out, sinMap, filas, usadas, sinMes, cols: {cliente: H[cCli], marca: cMar >= 0 ? H[cMar] : '-', segmento: cSeg >= 0 ? H[cSeg] : '-', periodo: cPer >= 0 ? H[cPer] : '-', cantidad: cQty >= 0 ? H[cQty] : '-'}};
}
async function subirVentas(file){
  const msg = $('#vtMsg'); if (!file) return;
  try {
    msg.textContent = 'Leyendo ' + file.name + '…';
    S.ventaFile = file;
    const X = await cargarXLSX();
    const wb = X.read(await file.arrayBuffer(), {type: 'array', cellDates: true});
    let res = null, err = null;
    for (const nom of wb.SheetNames){
      try { res = leerVentas(X.utils.sheet_to_json(wb.Sheets[nom], {header: 1, defval: null, raw: true}), S.ventaMes); break; } catch(e){ err = err || e; }
    }
    if (!res) throw err || new Error('No pude leer el archivo.');
    for (const [mes, o] of Object.entries(res.out)){
      D.ventas[mes] = o;
      if (CLOUD) await FBDB.ref(FB_ROOT + '/ventas/' + mes).set(JSON.stringify(o));
    }
    if (!CLOUD) saveCfg();
    S.ventaSinMap = Object.entries(res.sinMap).sort((a, b) => b[1] - a[1]).slice(0, 40);
    const meses = Object.keys(res.out).sort();
    S.vtMsg = `<span class="up">Listo:</span> ${meses.map(fMes).join(', ')} · ${fHL(res.usadas)} filas de cerveza CMQ de ${fHL(res.filas)} leídas · ${fHL(meses.reduce((a, m) => a + Object.keys(res.out[m]).length, 0))} clientes con compra.
      <br><span class="muted">Columnas usadas: cliente = ${esc(res.cols.cliente)}, marca = ${esc(res.cols.marca)}, segmento = ${esc(res.cols.segmento)}, mes = ${esc(res.cols.periodo)}, cantidad = ${esc(res.cols.cantidad)}.</span>
      ${S.ventaSinMap.length ? '<br>Hay marcas que no reconocí (abajo). Si alguna es cerveza CMQ, asignala y el archivo se vuelve a procesar solo.' : ''}`;
    render();
  } catch (e){ S.vtMsg = '<span class="down">Error: ' + esc(e.message) + '</span>'; render(); }
}
function ventasCardHtml(){

function bindVentas(){
  const f = $('#upVentas'); if (!f) return;
  $('#vtMes').onchange = e => { S.ventaMes = e.target.value; };
  f.onchange = e => subirVentas(e.target.files[0]);
  document.querySelectorAll('[data-delmes]').forEach(a => a.onclick = async e => {
    e.preventDefault(); const m = a.dataset.delmes;
    if (!confirm('¿Borrar la venta de ' + fMes(m) + '?')) return;
    delete D.ventas[m]; if (CLOUD) await FBDB.ref(FB_ROOT + '/ventas/' + m).remove(); else saveCfg(); render();
  });
  document.querySelectorAll('[data-vmap]').forEach(s => s.onchange = () => {
    D.ventaMap[s.dataset.vmap] = s.value; saveCfg();
    if (S.ventaFile) subirVentas(S.ventaFile); else render();
  });
  const vr = $('#vmReset'); if (vr) vr.onclick = e => { e.preventDefault(); D.ventaMap = {}; saveCfg(); render(); };
}

// ---------- PERFORMANCE POR CLIENTE ----------
const SEG_CORTO = [['VALUE', 'Value'], ['CORE', 'Core'], ['CORE PLUS', 'Core+'], ['PREMIUM', 'Premium'], ['SUPER PREMIUM', 'S.Prem']];
function perfCalc(ok){
  const tot = {}, cmq = {};
  for (const c of CIDS){ tot[c] = pdvTot(c, ok); cmq[c] = pdvTarget(c, ok, m => m.empresa === 'CMQ'); }
  // por segmento en el censo actual
  const segT = {}, segC = {};
  SEG_CORTO.forEach(([s]) => { segT[s] = pdvTarget(ACT, ok, m => m.segmento === s); segC[s] = pdvTarget(ACT, ok, m => m.segmento === s && m.empresa === 'CMQ'); });
  const ref = S.perfRef || CA, umbral = (S.perfUmbral ?? 5) / 100;
  const out = [];
  for (let i = 0; i < P.length; i++){
    if (!ok[i] || !CIDS.some(c => tot[c][i] > 0)) continue;
    const r = {i, hl: {}, som: {}, cmqHL: {}};
    CIDS.forEach(c => { r.hl[c] = tot[c][i]; r.cmqHL[c] = cmq[c][i]; r.som[c] = tot[c][i] > 0 ? cmq[c][i] / tot[c][i] : null; });
    r.seg = Object.fromEntries(SEG_CORTO.map(([s]) => [s, segT[s][i] > 0 ? segC[s][i] / segT[s][i] : null]));
    r.dCA = sub(r.som[ACT], r.som[CA]); r.dAA = sub(r.som[ACT], r.som[AA]);
    const d = sub(r.som[ACT], r.som[ref]);
    r.est = r.som[ACT] == null ? 'Sin volumen hoy' : r.som[ref] == null ? 'Nuevo' : d >= umbral ? 'Mejoró' : d <= -umbral ? 'Empeoró' : 'Estable';
    r.comp = r.hl[ACT] - r.cmqHL[ACT];
    out.push(r);
  }
  return out;
}
const EST_CLS = {'Mejoró': 'up', 'Empeoró': 'down', 'Estable': 'flat', 'Nuevo': '', 'Sin volumen hoy': 'flat'};
function rPerf(){
  const ok = pdvMask();

  const chips = ['Mejoró', 'Estable', 'Empeoró', 'Nuevo', 'Sin volumen hoy'].map(e =>
    `<button data-v="${e}" class="${S.perfEst === e ? 'on' : ''}">${e} · ${fHL(cnt[e] || 0)}</button>`).join('');

    {lab: 'Supervisor', l: true, fn: r => esc(P[r.i].sup), sv: r => P[r.i].sup},

    {lab: 'Subcanal', l: true, fn: r => esc(P[r.i].sub), sv: r => P[r.i].sub},
    ...CIDS.map((c, j) => ({lab: (j === 0 ? 'HL ' : '') + c, bl: j === 0, fn: r => r.hl[c] ? nf1.format(r.hl[c]) : '–', sv: r => r.hl[c] || 0})),

  return avisoUniverso() + `<div class="card"><h2>Performance por cliente</h2>
    <p class="desc">SOM de cada cliente en los 3 censos y su share CMQ dentro de cada segmento en ${CNAME[ACT]}. "Tendencia" compara el SOM actual contra el censo elegido: mejora o empeora si se mueve más que el umbral. Clic en un cliente para ver el detalle por marca.</p>

    <p class="muted" style="font-size:13px;margin:0">HL ${ACT} de los clientes que mejoraron: <b>${fHL(hlMov('Mejoró'))}</b> · que empeoraron: <b>${fHL(hlMov('Empeoró'))}</b></p></div>
    <div class="card">${table('tPerf', cols, rows, {groups: [['', 4], ['HL total cerveza', 3], ['SOM CMQ', 3], ['Variación (pp)', 2], ['SOM CMQ por segmento · ' + ACT, 5], ['', 2]],
      extra: `<input type="text" id="perfQ" placeholder="Buscar cliente o código…" value="${esc(S.perfQ || '')}" style="min-width:240px"><span class="muted">${fHL(rows.length)} clientes · ordenados por HL ${ACT} (clic en un encabezado para reordenar)</span>`})}</div>`;
}

// ---------- CLIENTES / PDA ----------
function clientesCalc(ok){
  const tot = {}, cmq = {};
  for (const c of CIDS){ tot[c] = pdvTot(c, ok); cmq[c] = pdvTarget(c, ok, m => m.empresa === 'CMQ'); }
  const out = [];
  for (let i = 0; i < P.length; i++){
    if (!ok[i]) continue;
    if (!CIDS.some(c => tot[c][i] > 0)) continue;
    const r = {i, tot: tot[ACT][i], cmq: cmq[ACT][i]};
    r.comp = r.tot - r.cmq; r.som = div(r.cmq, r.tot);
    r.somCA = div(cmq[CA][i], tot[CA][i]); r.somAA = div(cmq[AA][i], tot[AA][i]);
    r.totCA = tot[CA][i];
    out.push(r);
  }
  return out;
}

function verPdv(i){
  const p = P[i];
  const okAll = new Uint8Array(P.length); okAll[i] = 1;
  const segBak = S.seg; S.seg = '';
  const mar = Object.fromEntries(CIDS.map(c => [c, aggregate(c, okAll, (pp, m) => m.empresa + '|' + m.segmento + '|' + m.marca)]));
  const keys = new Set(); CIDS.forEach(c => mar[c].forEach((v, k) => keys.add(k)));
  const rows = [...keys].map(k => { const [e, s, m] = k.split('|'); return {e, s, m, d: Object.fromEntries(CIDS.map(c => [c, (mar[c].get(k) || {tot: 0}).tot]))}; })
    .sort((a, b) => (a.e > b.e ? 1 : a.e < b.e ? -1 : SEGMENTOS.indexOf(a.s) - SEGMENTOS.indexOf(b.s)));
  const tot = Object.fromEntries(CIDS.map(c => [c, rows.reduce((s, r) => s + r.d[c], 0)]));
  const cmq = Object.fromEntries(CIDS.map(c => [c, rows.filter(r => r.e === 'CMQ').reduce((s, r) => s + r.d[c], 0)]));
  S.seg = segBak;
  const est = CIDS.map(c => `<span class="pill">${c}: ${p.c[c] ? esc(p.c[c][1]) : 'no estaba en la base del censo'}</span>`).join(' ');
  $('#dlgT').textContent = `${p.rs} — ${p.id}`;
  $('#dlgB').innerHTML = `<p>Promotor actual: <b>${esc(p.ven)}</b> · Supervisor: <b>${esc(p.sup)}</b> · Subcanal: <b>${esc(p.sub)}</b> (${esc(p.canal)}) · ${esc(p.est)}${p.loc ? ' · ' + esc(p.loc) : ''}</p>
    <p>${est}</p>
    <div class="tw"><table><thead><tr><th class="l">Compañía</th><th class="l">Segmento</th><th class="l">Marca</th>${CIDS.map(c => `<th>HL ${c}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr><td class="l">${r.e}</td><td class="l">${r.s}</td><td class="l">${esc(r.m)}</td>${CIDS.map(c => `<td>${r.d[c] ? nf1.format(r.d[c]) : '–'}</td>`).join('')}</tr>`).join('')}
    <tr class="tot"><td class="l" colspan="3">Total cerveza</td>${CIDS.map(c => `<td>${nf1.format(tot[c])}</td>`).join('')}</tr>
    <tr class="tot"><td class="l" colspan="3">SOM CMQ</td>${CIDS.map(c => `<td>${fP(div(cmq[c], tot[c]))}</td>`).join('')}</tr></tbody></table></div>`;
  $('#dlg').showModal();
}

function cargarXLSX(){
  return new Promise((res, rej) => {
    if (window.XLSX) return res(window.XLSX);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error('No se pudo cargar el lector de Excel (¿sin internet?)'));
    document.head.appendChild(s);
  });
}
function canonId(x){
  let s = String(x ?? '').trim().split('.')[0];
  const rest = s.startsWith('47311200') && s.length > 8 ? s.slice(8) : s;
  const n = parseInt(rest, 10);
  return isNaN(n) ? '' : '47311200' + String(n).padStart(6, '0');
}
function norm(s){
  s = String(s ?? '').replace(/ /g, ' ').replace(/´/g, "'").replace(/\s+/g, ' ').trim();
  [['PIZZER??A', 'PIZZERIA'], ['CAF??', 'CAFE'], ['ESTACI??N', 'ESTACION'], ['??', '']].forEach(([a, b]) => { s = s.split(a).join(b); });
  return s;
}
const UP = s => norm(s).toUpperCase();
const SINT = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
function calibreCanon(c){
  const c0 = SINT(UP(c)).replace(/ /g, '');
  if (!c0) return '';
  if (c0.includes('TOTAL')) return 'TOTAL CALIBRES';
  if (['LITRO', 'LITRORETORNABLE', 'LITROOW', 'LITROPET', '1L'].includes(c0)) return 'LITRO';
  if (c0.includes('1,5') || c0.includes('1.5')) return '1,5 L';
  if (c0.includes('1,2') || c0.includes('1.2')) return '1,2 L';
  if (c0.includes('940')) return '940 CC';
  if (c0.includes('500')) return '500 CC';
  if (c0.includes('3/4') || (c0.includes('BOTELLA') && c0.includes('710'))) return 'BOTELLA 710';
  if (c0.includes('710')) return 'LATA 710';
  if (c0.includes('473') || c0.includes('410')) return 'LATA 473';
  if (c0.includes('330')) return c0.includes('LATA') ? 'LATA 330' : 'BOTELLA 330';
  return UP(c);
}

const REGLAS = [

  [/^0\.0% HEINEKEN/, 'HEINEKEN 0.0%', 'CCU', 'PREMIUM', true],
  [/^0\.0% IMPERIAL/, 'IMPERIAL 0.0%', 'CCU', 'CORE PLUS', true],
  [/^0\.0%.*CCU/, '0.0% TOTAL CCU', 'CCU', 'SIN SEGMENTO', true],
  [/^0\.0%/, '0.0% TOTAL CMQ', 'CMQ', 'SIN SEGMENTO', true],
  [/^1890|^BAJO CERO|^VALUE LATA CMQ/, '1890 + BAJO CERO', 'CMQ', 'VALUE', true],

  [/^BRAHMA/, 'BRAHMA', 'CMQ', 'CORE', true],
  [/^BUDWEISER/, 'BUDWEISER', 'CMQ', 'CORE', true],
  [/^ANDES ORIGEN/, 'ANDES ORIGEN', 'CMQ', 'CORE PLUS', true],
  [/^ANDES/, 'ANDES', 'CMQ', 'CORE', true],
  [/^STELLA/, 'STELLA ARTOIS', 'CMQ', 'PREMIUM', true],
  [/^CORONA/, 'CORONA', 'CMQ', 'SUPER PREMIUM', true],
  [/^PATAGONIA/, 'PATAGONIA', 'CMQ', 'SUPER PREMIUM', true],
  [/^MICHELOB/, 'MICHELOB', 'CMQ', 'CORE PLUS', true],
  [/^PALERMO|^IGUANA|^ISENBECK|^VALUE LATA CCU/, 'VALUE CCU', 'CCU', 'VALUE', true],
  [/^SCHNEIDER REMIX/, 'SCHNEIDER REMIX', 'CCU', 'CORE', true],
  [/^SCHNEIDER|^AMSTEL/, 'SCHNEIDER + AMSTEL', 'CCU', 'CORE', true],
  [/^MILLER/, 'MILLER', 'CCU', 'CORE PLUS', true],
  [/^IMPERIAL/, 'IMPERIAL', 'CCU', 'CORE PLUS', true],
  [/^HEINEKEN/, 'HEINEKEN', 'CCU', 'PREMIUM', true],
  [/^CORDOBA/, 'CORDOBA', 'CCU', 'VALUE', true],
  [/^SALTA/, 'SALTA', 'CCU', 'CORE PLUS', true],
  [/^NORTE/, 'NORTE', 'CCU', 'CORE', true],
  [/^SANTA FE/, 'SANTA FE', 'CCU', 'CORE', true],
  [/^361|^OTRAS VALUES \(361\)/, '361', 'OTROS', 'VALUE', true],
  [/^OTRAS VALUE|^OTROS VALUE/, 'VALUE OTROS', 'OTROS', 'VALUE', true],
  [/^BEAGLE|^CAPE HORN/, 'BEAGLE / CAPE HORN', 'OTROS', 'SUPER PREMIUM', true],
  [/^ZEUS/, 'ZEUS', 'OTROS', 'VALUE', true],
];
const SIN_APERTURA = new Set(['CORONA', 'PATAGONIA', 'MICHELOB', 'QUILMES 0.0%', 'STELLA ARTOIS 0.0%', 'CORONA 0.0%', 'HEINEKEN 0.0%', 'IMPERIAL 0.0%', '0.0% TOTAL CMQ', '0.0% TOTAL CCU', 'GANCIA 0.0%']);
function mapIdFor(censo, marca, cal, emp, seg){
  const key = [norm(marca), norm(cal)];
  let i = D.maps.findIndex(m => m.censo === censo && m.marca_orig === key[0] && m.calibre_orig === key[1]);
  if (i >= 0) return i;
  const K = s => SINT(UP(s));
  // 1) si la misma marca/calibre ya existe en otro censo, copia su configuración (respeta lo que hayas editado)
  const igual = D.maps.find(m => K(m.marca_orig) === K(key[0]) && calibreCanon(m.calibre_orig) === calibreCanon(cal));
  const sim = igual || D.maps.find(m => K(m.marca_orig) === K(key[0]));
  let row;
  if (sim){
    row = {marca: sim.marca, empresa: sim.empresa, segmento: sim.segmento, incluir: sim.incluir,
      calibre: sim.calibre === 'TOTAL CALIBRES' ? 'TOTAL CALIBRES' : (igual ? igual.calibre : calibreCanon(cal)), nuevo: false};
  } else {
    // 2) si no, usa las reglas de agrupación
    const r = REGLAS.find(x => x[0].test(K(key[0])));
    row = r ? {marca: r[1], empresa: r[2], segmento: r[3], incluir: r[4], nuevo: false}
            : {marca: UP(marca), empresa: ['CMQ', 'CCU'].includes(UP(emp)) ? UP(emp) : 'OTROS', segmento: SEGMENTOS.includes(UP(seg)) ? UP(seg) : 'SIN SEGMENTO', incluir: true, nuevo: true};
    row.calibre = SIN_APERTURA.has(row.marca) ? 'TOTAL CALIBRES' : calibreCanon(cal);
  }
  D.maps.push({censo, marca_orig: key[0], calibre_orig: key[1], empresa_orig: norm(emp), segmento_orig: norm(seg), factor: 1, ...row});
  return D.maps.length - 1;
}
async function subirArchivo(file, tipo, cid){
  if (!file) return;
  const msg = $('#upMsg'); msg.textContent = 'Leyendo ' + file.name + '…';
  try {
    const X = await cargarXLSX();
    const wb = X.read(await file.arrayBuffer(), {type: 'array'});
    // buscar la hoja que tiene los datos: en los templates oficiales es "Base HL" (no "Instrucciones" ni "Base Bultos")
    let A = null;
    const orden = [...wb.SheetNames].sort((x, y) => (/base hl/i.test(y) ? 1 : 0) - (/base hl/i.test(x) ? 1 : 0) || (/bultos/i.test(x) ? 1 : 0) - (/bultos/i.test(y) ? 1 : 0));
    for (const nom of orden){
      const filas = X.utils.sheet_to_json(wb.Sheets[nom], {header: 1, defval: null, raw: true});
      const tieneClave = tipo === 'censo' ? filas.slice(0, 40).some(r => r && r.some(v => norm(v) === 'Concat Distris'))
                                          : filas.slice(0, 5).some(r => r && r.some(v => norm(v) === 'Cliente'));
      if (tieneClave){ A = filas; break; }
    }
    if (!A) throw new Error(tipo === 'censo' ? 'No encontré en ninguna hoja la columna "Concat Distris".' : 'No encontré en ninguna hoja la columna "Cliente".');
    S.upMsg = tipo === 'censo' ? procesarCenso(A, cid, file.name) : procesarClientes(A);
    buildFacts(); rebuildLookups(); dirty = true;
    if (CLOUD){
      render(); $('#upMsg').innerHTML = S.upMsg + '<br>Publicando en la nube…';
      await publicarBase();
      S.upMsg = S.upMsg.replace('Después bajá el HTML actualizado.', '') + '<br><span class="up">Publicado: todos ven la base nueva al recargar.</span>';
      if (S.censoNuevo){ alert('Censo nuevo cargado y publicado. La página se va a recargar para tomarlo como censo actual.'); location.reload(); return; }
    } else if (S.censoNuevo){
      S.upMsg += '<br><b>Para verlo como censo actual, descargá el HTML y abrí ese archivo nuevo.</b>';
    }
    render();
  } catch (err){
    if (S.censoNuevo){ D.censos = D.censos.filter(c => c.id !== S.censoNuevo); delete D.facts[S.censoNuevo]; S.censoNuevo = null; }
    S.upMsg = '<span class="down">Error: ' + esc(err.message) + '</span>'; render();
  }
}
function procesarCenso(A, cid, nombreArchivo){
  cid = cid || ACT;
  const hr = A.findIndex(r => r && r.some(v => norm(v) === 'Concat Distris'));
  if (hr < 0) throw new Error('No encontré la fila de encabezados (columna "Concat Distris").');
  const H = A[hr].map(norm), col = n => H.indexOf(n);
  P.forEach(p => { if (p.c) delete p.c[cid]; });          // el censo se reemplaza entero
  const idx = new Map(P.map((p, i) => [p.id, i]));
  const nuevoPdv = (id, rs, sub) => { const i = P.length; P.push({id, rs: rs || '(sin nombre)', ven: 'NO ESTÁ EN BASE ACTUAL', sub, est: 'NO ESTÁ EN BASE', loc: '', c: {}}); idx.set(id, i); return i; };
  const cierre = (formato, n, facts, nuevos, noNum) => {
    D.facts[cid] = facts;
    D.calidad = D.calidad.filter(c => !(c.censo === cid && c.tipo !== 'Fuente'));
    D.calidad = D.calidad.filter(c => !(c.censo === cid && c.tipo === 'Fuente'));
    D.calidad.push({censo: cid, tipo: 'Fuente', detalle: `${CNAME[cid]} cargado desde ${nombreArchivo || 'archivo'} (${formato}).`});
    Object.entries(noNum).forEach(([mi, k]) => D.calidad.push({censo: cid, tipo: 'Valores no numéricos', detalle: `${D.maps[mi].marca_orig} ${D.maps[mi].calibre_orig}: ${k} PDV con texto en vez de número (se toman como 0)`}));
    D.fuentes = D.fuentes || {}; D.fuentes[cid] = nombreArchivo || formato;
    if (cid === ACT) D.fuenteActNombre = nombreArchivo || formato;
    const nNuevas = D.maps.filter(m => m.nuevo && m.censo === cid).length;
    const tot = facts.reduce((s, f) => s + (D.maps[f[1]].incluir ? f[2] : 0), 0);
    const cmq = facts.reduce((s, f) => s + (D.maps[f[1]].incluir && D.maps[f[1]].empresa === 'CMQ' ? f[2] : 0), 0);
    return `<span class="up">Listo — ${CNAME[cid]} reemplazado (${formato}):</span> ${fHL(n)} PDV de Logística Total, ${fHL(tot)} HL de cerveza, ${fHL(cmq)} HL CMQ (SOM ${fP(div(cmq, tot))})${nuevos ? `, ${nuevos} PDV que no estaban antes` : ''}.
      ${nNuevas ? `<br><b>${nNuevas} marcas/calibres que no reconocí</b>: revisalos en la tabla de abajo (filtrá ${cid}).` : ''} Revisá los números y después bajá el HTML actualizado.`;
  };
  // formato largo: una fila por PDV y artículo (BASE_HL_OCT25 / ABR26)
  if (col('Valores') >= 0 && col('Marca') >= 0 && col('Calibre') >= 0){
    const c = {id: col('Concat Distris'), m: col('Marca'), cal: col('Calibre'), e: col('Empresa'), s: col('Segmento'), v: col('Valores'),
      cens: col('Censado'), mot: col('Motivo No Censo'), pro: col('Promotor'), sub: col('Subcanal MKT'), rs: col('Razon social')};
    const agg = new Map(), noNum = {}; let nuevos = 0; const vistos = new Set();
    for (let r = hr + 1; r < A.length; r++){
      const row = A[r]; if (!row) continue;
      const rawId = String(row[c.id] ?? '').trim(); if (!rawId.startsWith('473112')) continue;
      const id = canonId(rawId); if (!id) continue;
      let i = idx.get(id); if (i == null){ i = nuevoPdv(id, norm(row[c.rs]), UP(row[c.sub])); nuevos++; }
      if (!vistos.has(i)){
        vistos.add(i);
        const cens = String(row[c.cens] ?? '').trim() === '1' || UP(row[c.cens]) === 'SI';
        const mot = norm(row[c.mot]);
        P[i].c[cid] = [cens ? 1 : 0, cens ? 'Censado' : (mot && mot !== '0' ? mot : 'Sin dato'), norm(row[c.pro]), UP(row[c.sub])];
      }
      const mi = mapIdFor(cid, row[c.m], row[c.cal], row[c.e], row[c.s]);
      const v = row[c.v]; if (v == null || v === '') continue;
      const x = typeof v === 'number' ? v : Number(String(v).replace(',', '.'));
      if (isNaN(x)){ noNum[mi] = (noNum[mi] || 0) + 1; continue; }
      if (x !== 0){ const k = i + '|' + mi; agg.set(k, (agg.get(k) || 0) + x); }
    }
    const facts = [...agg.entries()].map(([k, v]) => { const [i, mi] = k.split('|').map(Number); return [i, mi, Math.round(v * 1e4) / 1e4]; });
    return cierre('base larga por artículo', vistos.size, facts, nuevos, noNum);
  }
  const cPreg = col('Pregunta -->');
  if (cPreg < 0) throw new Error('No encontré la columna "Pregunta -->" del censo.');
  const meta = {}; for (let r = 0; r < hr; r++){ const l = norm(A[r] && A[r][cPreg]); if (['CMQ/CCU', 'Marca', 'Segmento', 'Calibre'].includes(l)) meta[l] = r; }
  const prods = []; let formato;
  if (meta.Marca != null){
    // formato 1: template del distribuidor (filas de compañía / marca / segmento / calibre arriba)
    formato = 'template del distribuidor';
    let calFF = '';
    for (let c = cPreg + 1; c < H.length; c++){
      const cal = norm(A[meta.Calibre][c]); if (cal) calFF = cal;
      const marca = norm(A[meta.Marca][c]).replace(/-+$/, '').trim(); if (!marca) continue;
      prods.push({c, mi: mapIdFor(cid, marca, calFF, A[meta['CMQ/CCU']][c], A[meta.Segmento][c])});
    }
  } else {
    // formato 2: resultados finales de la región (una sola fila de encabezado "MARCA-CALIBRE", todas las distribuidoras)
    formato = 'resultados de la región';
    const clave = s => SINT(UP(s)).replace(/[^A-Z0-9%]/g, '');
    const porClave = new Map();
    D.maps.forEach((m, i) => { if (m.censo === cid) porClave.set(clave(m.marca_orig + m.calibre_orig), i); });
    for (let c = cPreg + 1; c < H.length; c++){
      const h = H[c]; if (!h || h.startsWith('¿') || /^Unnamed/.test(h)) continue;
      let mi = porClave.get(clave(h));
      if (mi == null){
        const k = h.lastIndexOf('-'); if (k <= 0) continue;
        mi = mapIdFor(cid, h.slice(0, k).replace(/-+$/, '').trim(), h.slice(k + 1).trim(), '', '');
      }
      prods.push({c, mi});
    }
    if (!prods.length) throw new Error('No reconocí las columnas de marcas del archivo.');
  }
  const cDis = col('Código Directa/Distri');
  const facts = [], noNum = {}; let n = 0, nuevos = 0;
  for (let r = hr + 1; r < A.length; r++){
    const row = A[r]; if (!row) continue;
    const rawId = String(row[col('Concat Distris')] ?? '').trim();
    if (cDis >= 0 && row[cDis] != null && String(row[cDis]).trim() !== '473112') continue;   // solo Logística Total
    if (!rawId.startsWith('473112')) continue;
    const id = canonId(rawId); if (!id) continue;
    n++;
    let i = idx.get(id);
    if (i == null){ i = nuevoPdv(id, '', UP(row[col('Subcanal MKT')])); nuevos++; }
    const cens = UP(row[col('Pdv es censable')]) === 'SI', mot = norm(row[col('Motivo No Censo')]);
    P[i].c[cid] = [cens ? 1 : 0, cens ? 'Censado' : (mot || 'Sin dato'), norm(row[col('Promotor')]), UP(row[col('Subcanal MKT')])];
    for (const p of prods){
      const v = row[p.c]; if (v == null || v === '') continue;
      const x = typeof v === 'number' ? v : Number(String(v).replace(',', '.'));
      if (isNaN(x)){ noNum[p.mi] = (noNum[p.mi] || 0) + 1; continue; }
      if (x !== 0) facts.push([i, p.mi, Math.round(x * 1e4) / 1e4]);
    }
  }
  return cierre(formato, n, facts, nuevos, noNum);
}
function procesarClientes(A){
  const H = (A[0] || []).map(norm), col = n => H.indexOf(n);
  const cCli = col('Cliente'), cVen = col('Fuerza de venta 1 Descripcion personal comercial'), cSub = col('Descripcion subcanal'),
    cRs = col('Razon social'), cAn = col('Anulado'), cLoc = col('Descripcion localidad');
  if (cCli < 0 || cVen < 0) throw new Error('No encontré las columnas "Cliente" y "Fuerza de venta 1 Descripcion personal comercial".');
  const m = new Map();
  for (let r = 1; r < A.length; r++){ const row = A[r]; if (!row || row[cCli] == null) continue; m.set(canonId(row[cCli]), row); }
  let act = 0;
  P.forEach(p => {
    const row = m.get(p.id);
    if (!row){ p.ven = 'NO ESTÁ EN BASE ACTUAL'; p.est = 'NO ESTÁ EN BASE'; return; }
    act++;
    p.ven = UP(row[cVen]) || 'SIN VENDEDOR'; p.sub = UP(row[cSub]) || p.sub; p.est = UP(row[cAn]) === 'SI' ? 'ANULADO' : 'ACTIVO';
    const rs = norm(row[cRs]); if (rs && rs !== 'HISTORICO') p.rs = rs; p.loc = cLoc >= 0 ? norm(row[cLoc]) : p.loc;
  });
  const nv = [...new Set(P.map(p => p.ven))].filter(v => !D.venMap.some(r => r.ven === v));
  nv.forEach(v => D.venMap.push({ven: v, sup: 'OTROS (sin supervisor)'}));
  const ns = [...new Set(P.map(p => p.sub))].filter(s => s && !D.subMap.some(r => r.sub === s));
  ns.forEach(s => D.subMap.push({sub: s, canal: /^(REG|BASE|TOP|CADENA|KA) /.test(s) ? 'REF' : 'K+T'}));
  D.venMap.sort((a, b) => a.ven < b.ven ? -1 : 1); D.subMap.sort((a, b) => a.sub < b.sub ? -1 : 1);
  return `<span class="up">Listo:</span> ${fHL(act)} PDV encontrados en la base nueva.${nv.length ? `<br><b>Promotores nuevos sin supervisor:</b> ${esc(nv.join(', '))}. Asignalos abajo.` : ''}${ns.length ? `<br>Subcanales nuevos: ${esc(ns.join(', '))} (revisá el canal).` : ''} Después bajá el HTML actualizado.`;
}

function render(){
  renderTabs(); renderFilters();
  const fn = {resumen: rResumen, som: rSom, sos: rSos, dist: rDist, opo: rOpo, perf: rPerf, cli: rCli, cfg: rCfg}[S.tab];
  $('#main').innerHTML = fn();
}
buildFacts();
loadCfg();
render();
LISTO = true; window.__APP_OK = true;
pintarUsuario();
if (CLOUD) setTimeout(migrarLocal, 600);
